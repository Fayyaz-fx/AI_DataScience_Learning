        - generic [ref=e886]:
          - heading "Expert Review/Comment" [level=2] [ref=e889]
          - generic [ref=e891]:
            - generic [ref=e895]:
              - heading "Suharmili Rosle" [level=3] [ref=e896]
              - emphasis [ref=e897]: University College Bestari
              - link ", Malaysia" [ref=e898] [cursor=pointer]:
                - /url: "#/"
              - paragraph [ref=e899]: It was a great pleasure to be part of the International Webinar on Aquaculture and Marine Biology. I enjoyed the presentation and meeting respected colleagues from all over the world. One of the biggest benefits is the webinar really felt like we were there together. I will consider it for the next meeting. Thank you, Conference Mind Organizer!
            - generic [ref=e903]:
              - heading "Jihua Chen" [level=3] [ref=e904]
              - emphasis [ref=e905]: Oak Ridge National Laboratory
              - link ", USA" [ref=e906] [cursor=pointer]:
                - /url: "#/"
              - paragraph [ref=e907]: The Conference Mind organizer did an excellent job of putting things together. I very much enjoyed the talks and discussions. I will consider it for the next meeting.
            - generic [ref=e911]:
              - heading "N. Anand Laxmi" [level=3] [ref=e912]
              - emphasis [ref=e913]: Directorate of Poultry Research
              - link ", India" [ref=e914] [cursor=pointer]:
                - /url: "#/"
              - paragraph [ref=e915]: It was a wonderful experience and a good organization of the program by the Conference Mind.
              - link [ref=e916] [cursor=pointer]:
                - /url: https://www.youtube.com/watch?v=i9VR8gKlTSA
            - generic [ref=e921]:
              - heading "Maria Cândida Arrais de Miranda Mousinho" [level=3] [ref=e922]
              - emphasis [ref=e923]: Institute of Education, Science and Technology
              - link ", Brazil" [ref=e924] [cursor=pointer]:
                - /url: "#/"
              - paragraph [ref=e925]: Thank you very much Conference Mind Team for the invitation to participate in the International Webinar on Energy. It was a great opportunity to share ideas and get to know the work of incredible professionals. Congratulations to everyone and the entire organizing team.
            - generic [ref=e929]:
              - heading "Rakhi Gangil" [level=3] [ref=e930]
              - emphasis [ref=e931]: Nanaji Deshmukh Veterinary University
              - link ", India" [ref=e932] [cursor=pointer]:
                - /url: "#/"
              - paragraph [ref=e933]: It is my immense pleasure to share my experience over the International Webinar on Veterinary and Livestock research. I feel privileged that organizer of this conference gave me opportunity to be a part of this valuable event. It would like to thank organizers of this conference for planning, organisation, and flawless execution of entire sessions. The theme of this International conference covered holistic view of entire areas of veterinary and livestock research. I hope this conference might be helpful in updation of knowledge of participants on advance aspects of veterinary and livestock research.
            - generic [ref=e937]:
              - heading "Mohammed Jaffer Pinjar" [level=3] [ref=e938]
              - emphasis [ref=e939]: Government Medical College Mahbubnagar
              - link ", India" [ref=e940] [cursor=pointer]:
                - /url: "#/"
              - paragraph [ref=e941]: It was a very good experience with your international Webinar. This gave me the opportunity to gain knowledge from renowned scholars from all over the world. It has helped me in presenting as well as updating the current research on diabetes and healthcare. I thank the Conference Mind and all the panelists and organizers for conducting such a wonderful International Webinar. I was satisfied with the organizer's arrangements in conducting the webinar.
            - generic [ref=e945]:
              - heading "Suraj Wasudeo Nagre" [level=3] [ref=e946]
              - emphasis [ref=e947]: Grant Medical College
              - link ", India" [ref=e948] [cursor=pointer]:
                - /url: "#/"
              - paragraph [ref=e949]: The International Web Conference on Heart was excellent academic feast for all fraternity doctors. I feel proud to be part of it. It helped all of us to improve our knowledge and clear our misconceptions. It was a very nice platform to present our research to all over the world. It will be great pleasure to participate in such web conferences again in future. Thank you very much to the organizing committee members of Conference Mind.
            - generic [ref=e953]:
              - heading "Debabrata Singh" [level=3] [ref=e954]
              - emphasis [ref=e955]: SOA University
              - link ", India" [ref=e956] [cursor=pointer]:
                - /url: "#/"
              - paragraph [ref=e957]: I got privileged to be a part of an International Webinar on Diabetes and Healthcare. That was my wonderful experience. Mainly the website is very impressive. We planned a lot for the conference, but due to Covid-19, we didn't execute it. By the way, the online conference was also successfully completed. Thank you Conference Mind Team.
            - generic [ref=e961]:
              - heading "Goutam Kumar Acherjya" [level=3] [ref=e962]
              - emphasis [ref=e963]: Jashore Medical College
              - link ", Bangladesh" [ref=e964] [cursor=pointer]:
                - /url: "#/"
              - paragraph [ref=e965]: Initially, I would like to show my heartfelt gratitude and cordial thanks for inviting me as a keynote speaker in your conference on Diabetes and Healthcare 2020 and giving me the opportunity to deliver my presentation in such a prestigious seminar. I must be thanking you for sharing my E certificate, which is really incredible for me. Yes, of course, I am announcing to join any of your conferences related to my field if you would invite me in the future. This would really be an honoured and pleasure for me. I should be thanking you once again for doing everything and your virtual hospitality.
            - generic [ref=e969]:
              - heading "Anastasiia Radchenko" [level=3] [ref=e970]
              - emphasis [ref=e971]: L.T.Malaya Of The National Academy Of Sciences Of Ukraine
              - link ", Ukraine" [ref=e972] [cursor=pointer]:
                - /url: "#/"
              - paragraph [ref=e973]: Thank you very much Conference Mind. I was very pleased to participate and share my research paper at the International Webinar on Heart.
            - generic [ref=e977]:
              - heading "Suresh Aluvihara" [level=3] [ref=e978]
              - emphasis [ref=e979]: University of Peradeniya
              - link ", Sri Lanka" [ref=e980] [cursor=pointer]:
                - /url: "#/"
              - paragraph [ref=e981]: The International Webinar on Earth Science and Climatic Change was a great platform to share the research experiences and most outstanding investigations of scientific world among new investigators and to enhance their skills and knowledge forever. Also it will be highly appreciated the well organization and great effort of the Conference Mind committee to conduct the conference in better manner. Thank you and good luck...!!!
            - generic [ref=e985]:
              - heading "Sai Krishna Repalli" [level=3] [ref=e986]
              - emphasis [ref=e987]: ICAR-National Rice Research Institute(NRRI)
              - link ", India" [ref=e988] [cursor=pointer]:
                - /url: "#/"
              - paragraph [ref=e989]: It is a great experience to participate in the International Webinar on Plant Science and Plant Genomics. It was an educative endeavor for exposure to all the International scientists. Congratulations to the Conference Mind team for organizing the webinar in a coherent manner
            - generic [ref=e993]:
              - heading "Farshid Talat" [level=3] [ref=e994]
              - emphasis [ref=e995]: West Azerbaijan Agricultural
              - link ", Iran" [ref=e996] [cursor=pointer]:
                - /url: "#/"
              - paragraph [ref=e997]: It was a great event, organized very well. Gave us an opportunity to meet with wonderful people & innovative scientists. Conference Mind created an amazing platform for learning & sharing and recognizing excavatorial spirit. It was great to meet such a vibrant collection of scientists from the globe to demonstrate that science and technology are still alive and kicking despite all the current economic and Corona pandemic gloom. Kudos to the Conference Mind team for a great event!
            - generic [ref=e1001]:
              - heading "Saumya Vyas" [level=3] [ref=e1002]
              - emphasis [ref=e1003]: Barkatullah University
              - link ", India" [ref=e1004] [cursor=pointer]:
                - /url: "#/"
              - paragraph [ref=e1005]: This is Saumya Vyas, it was wonderful webinar organized by Conference Mind I am satisfied after attending International webinar on Earth Science and Climate Change during October 07-08, 2020. You all are doing great job in bringing up well known researchers together from different countries to share their work with each other.
            - generic [ref=e1009]:
              - heading "Mitra Lal Pathak" [level=3] [ref=e1010]
              - emphasis [ref=e1011]: Ministry of Forests and Environment
              - link ", Nepal" [ref=e1012] [cursor=pointer]:
                - /url: "#/"
              - paragraph [ref=e1013]: I would like to thanks the organizer of this event for giving me this opportunity to participate and present my oral presentation. it’s a great pleasure to be a part of International Webinar on Plant Genomics and Plant Science. Infact, It was an amazing experience to share scientific findings and also it was a huge platform to learn new things for me. Looking forward to meet you all nice people in the future too.
            - generic [ref=e1017]:
              - heading "Navnit Kumar" [level=3] [ref=e1018]
              - emphasis [ref=e1019]: Dr. Rajendra Prasad Central Agricultural University
